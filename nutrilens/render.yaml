services:
  # NutriLens Backend Web Service
  - type: web
    name: nutrilens-backend
    runtime: python
    rootDir: nutrilens/backend
    buildCommand: "pip install --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/ -r requirements.txt && alembic upgrade head && python app/seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: nutrilens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://nutrilens.vercel.app", "http://localhost:5173"]'

  # NutriLens Frontend Static Site (or deploy on Vercel)
  - type: web
    name: nutrilens-frontend
    runtime: static
    rootDir: nutrilens/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nutrilens-backend
          property: host

databases:
  - name: nutrilens-db
    plan: free
    region: oregon
    databaseName: nutrilens_db
    user: nutrilens_user
